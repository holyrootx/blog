# Google만 활성화하는 로컬 추가 설정입니다.
# backend/application-local.properties로 복사하고 ops/local-development.md의 명령으로 읽습니다.
# 실제 클라이언트 ID/secret은 backend/.env에서 전달합니다.
spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:5173/login/oauth2/code/google
# 현재 애플리케이션은 일반 OAuth2 UserService를 사용하므로 openid를 추가하지 않습니다.
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.client-name=Google
blog.frontend.base-url=http://localhost:5173
