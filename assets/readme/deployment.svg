<text x="180" y="389" font-size="23" fill="#243e55" font-weight="400">테스트 → JAR·정적 파일 빌드</text>
<text x="180" y="426" font-size="23" fill="#647b8e" font-weight="400">검증된 산출물을 배포 작업에서 재사용</text>
<path d="M642 389 H800" fill="none" stroke="#52779b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="661" y="372" font-size="23" fill="#557997" font-weight="600">SSH / SCP</text>
<rect x="800" y="308" width="595" height="161" rx="20" fill="#eef7f2" stroke="#dbe5ee" stroke-width="1.5"/>
<text x="823" y="347" font-size="26" fill="#243e55" font-weight="700">5. AWS Lightsail</text>
<text x="823" y="387" font-size="23" fill="#243e55" font-weight="400">파일 백업·교체 → systemd 재시작</text>
<text x="823" y="420" font-size="23" fill="#647b8e" font-weight="400">상태 · DB · 공개 자산 · 배포 버전 검증</text>
<text x="823" y="449" font-size="23" fill="#647b8e" font-weight="400">적용 후 실패 시 이전 앱 파일 복구·재검증</text>
<text x="42" y="512" font-size="23" fill="#718697" font-weight="400">애플리케이션 파일 복구와 데이터베이스 복원은 별도 절차입니다.</text>
