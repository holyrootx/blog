<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="555" viewBox="0 0 1440 555" role="img" aria-labelledby="title desc"><title id="title">JSJ.log 개발·배포 흐름</title><desc id="desc">작업 브랜치를 develop으로 PR 병합하고, develop을 release로 PR 병합합니다. release push는 GitHub Actions의 테스트와 빌드를 실행하고 검증 산출물을 Lightsail에 배포합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52779b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style></defs>
<rect x="0" y="0" width="1440" height="555" rx="20" fill="#f7f9fc" stroke="#dbe5ee" stroke-width="1.5"/>
<text x="42" y="53" font-size="29" fill="#243e55" font-weight="700">JSJ.log 개발·배포 흐름</text>
<text x="42" y="87" font-size="23" fill="#6a7f90" font-weight="400">작업 단위 PR → 통합 → 릴리즈 → 자동 검증과 배포</text>
<rect x="42" y="126" width="330" height="103" rx="20" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/>
<text x="64" y="165" font-size="26" fill="#243e55" font-weight="700">1. 작업 브랜치</text>
<text x="64" y="204" font-size="23" fill="#647b8e" font-weight="400">기능·수정 단위 구현</text>
<rect x="453" y="126" width="330" height="103" rx="20" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/>
<text x="475" y="165" font-size="26" fill="#243e55" font-weight="700">2. develop</text>
<text x="475" y="204" font-size="23" fill="#647b8e" font-weight="400">PR 검토 후 통합</text>
<rect x="864" y="126" width="330" height="103" rx="20" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/>
<text x="886" y="165" font-size="26" fill="#243e55" font-weight="700">3. release</text>
<text x="886" y="204" font-size="23" fill="#647b8e" font-weight="400">배포 범위 검토 후 PR 병합</text>
<path d="M372 179 H453" fill="none" stroke="#52779b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="389" y="161" font-size="23" fill="#557997" font-weight="600">PR</text>
<path d="M783 179 H864" fill="none" stroke="#52779b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="800" y="161" font-size="23" fill="#557997" font-weight="600">PR</text>
<path d="M1029 229 V267 H342 V308" fill="none" stroke="#52779b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="610" y="256" font-size="23" fill="#557997" font-weight="600">release push → 자동 실행</text>
<rect x="42" y="308" width="600" height="161" rx="20" fill="#eef4fb" stroke="#dbe5ee" stroke-width="1.5"/>
<text x="65" y="347" font-size="26" fill="#243e55" font-weight="700">4. GitHub Actions</text>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" x="69" y="365" width="36" height="36"><ns0:defs><ns0:linearGradient id="a" x1="6" x2="235" y1="33" y2="344" gradientTransform="translate(0 .937) scale(.3122)" gradientUnits="userSpaceOnUse"><ns0:stop offset="0" stop-color="#41d1ff" /><ns0:stop offset="1" stop-color="#bd34fe" /></ns0:linearGradient><ns0:linearGradient id="b" x1="194.651" x2="236.076" y1="8.818" y2="292.989" gradientTransform="translate(0 .937) scale(.3122)" gradientUnits="userSpaceOnUse"><ns0:stop offset="0" stop-color="#ffea83" /><ns0:stop offset=".083" stop-color="#ffdd35" /><ns0:stop offset="1" stop-color="#ffa800" /></ns0:linearGradient></ns0:defs><ns0:path fill="url(#a)" d="M124.766 19.52 67.324 122.238c-1.187 2.121-4.234 2.133-5.437.024L3.305 19.532c-1.313-2.302.652-5.087 3.261-4.622L64.07 25.187a3.09 3.09 0 0 0 1.11 0l56.3-10.261c2.598-.473 4.575 2.289 3.286 4.594Zm0 0" /><ns0:path fill="url(#b)" d="M91.46 1.43 48.954 9.758a1.56 1.56 0 0 0-1.258 1.437l-2.617 44.168a1.563 1.563 0 0 0 1.91 1.614l11.836-2.735a1.562 1.562 0 0 1 1.88 1.836l-3.517 17.219a1.562 1.562 0 0 0 1.985 1.805l7.308-2.223c1.133-.344 2.223.652 1.985 1.812l-5.59 27.047c-.348 1.692 1.902 2.614 2.84 1.164l.625-.968 34.64-69.13c.582-1.16-.421-2.48-1.69-2.234l-12.185 2.352a1.558 1.558 0 0 1-1.793-1.965l7.95-27.562A1.56 1.56 0 0 0 91.46 1.43Zm0 0" /></ns0:svg>
