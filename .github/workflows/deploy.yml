name: Deploy Blog

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: ./gradlew clean bootJar

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend jar
        run: |
          JAR_FILE=$(find backend/build/libs -name "*.jar" ! -name "*plain*" | head -n 1)
          scp -i ~/.ssh/lightsail_key "$JAR_FILE" \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/home/ubuntu/apps/blog/backend/app.jar

      - name: Upload frontend dist
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/lightsail_key" \
            frontend/dist/ \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/tmp/blog-dist/

      - name: Restart backend and apply frontend
        run: |
          ssh -i ~/.ssh/lightsail_key \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
              set -e
              sudo rsync -av --delete /tmp/blog-dist/ /var/www/blog/
              sudo systemctl restart blog-backend
              sudo systemctl status blog-backend --no-pager
          EOF