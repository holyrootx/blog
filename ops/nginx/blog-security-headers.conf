# HTTPS server 블록과 자체 add_header가 있는 location에서 include한다.
# 기존 CSP Report-Only와 중복 add_header는 이 설정으로 교체한다.
# HSTS는 현재 호스트에만 적용한다. 하위 도메인과 preload는 포함하지 않는다.
# 백엔드가 보낸 같은 헤더는 Nginx에서 한 번만 내려준다.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Cloudflare 분석 스크립트와 편집기의 업로드 전 blob 이미지 미리보기를 허용한다.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
