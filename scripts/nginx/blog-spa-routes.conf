# jsjlog.me의 HTTPS server 블록에서 기존 location / 대신 include한다.
# /api/, /oauth2/, /login/oauth2/, /posts/{id}의 기존 프록시 설정은 유지한다.
# HTML만 저장하지 않는다. 해시가 붙은 /assets/ 파일은 기존 정적 파일 설정을 쓴다.
# add_header를 선언한 location은 상위 보안 헤더를 상속하지 않으므로 다시 include한다.
location = / {
    try_files /index.html =503;
    include /etc/nginx/snippets/blog-security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location = /index.html {
    try_files /index.html =503;
    include /etc/nginx/snippets/blog-security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location ~ ^/(posts|login|oauth/callback|settings|guestbook|privacy|terms|admin(/(login|dashboard|menus|posts(/(new|[1-9][0-9]*))?|images|categories|comments|guestbook|members|codes|home))?)/?$ {
    try_files /index.html =503;
    include /etc/nginx/snippets/blog-security-headers.conf;
    add_header Cache-Control "no-store" always;
}

error_page 404 /404.html;

location = /404.html {
    internal;
    include /etc/nginx/snippets/blog-security-headers.conf;
    add_header Cache-Control "no-store" always;
}

location / {
    try_files $uri $uri/ =404;
}
