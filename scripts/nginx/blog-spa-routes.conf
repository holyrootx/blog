# jsjlog.me의 HTTPS server 블록에서 기존 location / 대신 include한다.
# /api/, /oauth2/, /login/oauth2/, /posts/{id}의 기존 프록시 설정은 유지한다.
location ~ ^/(posts|login|oauth/callback|settings|guestbook|privacy|terms|admin(/(login|dashboard|menus|posts(/(new|[1-9][0-9]*))?|images|categories|comments|guestbook|members|codes|home))?)/?$ {
    try_files /index.html =503;
}

error_page 404 /404.html;

location = /404.html {
    internal;
}

location / {
    try_files $uri $uri/ =404;
}
