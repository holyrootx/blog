spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:blog_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

blog:
  upload:
    max-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
    r2:
      # 컨텍스트가 뜨게만 하는 더미 값이다. 실제 저장은 FakeImageStorage 가 가로챈다
      endpoint: "https://test.r2.invalid"
      bucket: "test-bucket"
      region: "auto"
      access-key-id: "test"
      secret-access-key: "test"
      public-base-url: "https://images.test"
