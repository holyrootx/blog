plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.jsjlog.blog'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.29.52')
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework:spring-aop'
	implementation 'org.aspectj:aspectjweaver'
	implementation 'com.sksamuel.scrimage:scrimage-core:4.3.4'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.3.4'
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'
	// 쿼리 로그용. implementation 으로 두면 운영 jar 에 실려 DataSource 를 감싸고
	// 모든 SQL 이 운영 로그에 찍힌다. developmentOnly 는 bootJar 에서 빠진다
	developmentOnly 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 이미지 검사도 GUI 없이 실행한다. macOS에서 단독 실행할 때도 서버와 같은 조건을 쓴다.
tasks.withType(Test).configureEach {
	systemProperty 'java.awt.headless', 'true'
}

tasks.named('test') {
	useJUnitPlatform()
	exclude '**/AdminPostBrowserIntegrationTest.class'
}

// H2 기본 검사는 유지하고, 같은 핵심 경로를 격리 MySQL에서도 실행한다.
tasks.register('mysqlTest', Test) {
	group = 'verification'
	description = 'Run core transaction, concurrency and restart checks against isolated MySQL'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	maxParallelForks = 1
	outputs.upToDateWhen { false }
	filter {
		includeTestsMatching '*MenuCategoryConcurrencyTest'
		includeTestsMatching '*ImageReferenceConcurrencyTest'
		includeTestsMatching '*PostTrashHistoryTest'
		includeTestsMatching '*CommentRetentionTest'
		includeTestsMatching '*CommentRetentionConcurrencyTest'
		includeTestsMatching '*MemberStatusLifecycleTest'
		includeTestsMatching '*OAuthSignupIntegrityTest'
		includeTestsMatching '*MySqlRestartPersistenceTest'
		includeTestsMatching '*PostViewRecordTest'
		includeTestsMatching '*AdminPostViewApiTest'
		includeTestsMatching '*MemberReadingApiTest'
		includeTestsMatching '*AdminViewStatsTest'
		includeTestsMatching '*GuestbookRetentionTest'
		includeTestsMatching '*GuestbookNotificationTest'
		includeTestsMatching '*AdminGuestbookApiTest'
	}
	doFirst {
		if (!System.getenv('BLOG_TEST_MYSQL_PORT') || !System.getenv('BLOG_TEST_MYSQL_PASSWORD')) {
			throw new GradleException('mysqlTest requires BLOG_TEST_MYSQL_PORT and BLOG_TEST_MYSQL_PASSWORD; H2 fallback is not allowed')
		}
	}
}

// 실제 HTTP + 브라우저 검사는 별도 명령으로 실행하고 H2로 대체하지 않는다.
tasks.register('browserIntegrationTest', Test) {
	group = 'verification'
	description = 'Run the administrator browser flow against real Spring and isolated MySQL'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	maxParallelForks = 1
	outputs.upToDateWhen { false }
	filter { includeTestsMatching '*AdminPostBrowserIntegrationTest' }
	testLogging { showStandardStreams = true }
	doFirst {
		if (!System.getenv('BLOG_TEST_MYSQL_PORT') || !System.getenv('BLOG_TEST_MYSQL_PASSWORD')) {
			throw new GradleException('browserIntegrationTest requires BLOG_TEST_MYSQL_PORT and BLOG_TEST_MYSQL_PASSWORD; H2 fallback is not allowed')
		}
	}
}
